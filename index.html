<!-- TAB 4: CHỈ ĐỊNH CẬN LÂM SÀNG (ĐÃ BỎ THUẬT NGỮ DƯ THỪA) -->
<div id="chi-dinh-cls" class="tab-content">
    <div class="card">
        <div class="card-title">CHỈ ĐỊNH CẬN LÂM SÀNG (CLS)</div>
        <div id="clsPatientBrief" style="font-size: 14px; font-weight: bold; color: var(--primary); margin-bottom: 15px;">
            Chưa chọn bệnh nhân. Vui lòng chọn ở tab "Chờ Khám".
        </div>

        <!-- NHÓM 1: HUYẾT HỌC - ĐÔNG MÁU -->
        <div class="cls-category-title">🩸 1. HUYẾT HỌC - ĐÔNG MÁU</div>
        <div class="cls-grid">
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Thời gian đông máu"> Thời gian đông máu</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Tổng phân tích tế bào máu ngoại vi"> Tổng phân tích tế bào máu ngoại vi</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Định nhóm máu hệ ABO"> Định nhóm máu hệ ABO</label>
        </div>

        <!-- CÁC NHÓM KHÁC GIỮ NGUYÊN -->
        <div class="cls-category-title">🧪 2. HÓA SINH MÁU</div>
        <div class="cls-grid">
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Đo hoạt độ ALT (GPT)"> Đo hoạt độ ALT (GPT)</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Đo hoạt độ AST (GOT)"> Đo hoạt độ AST (GOT)</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Đo hoạt độ GGT"> Đo hoạt độ GGT</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Định lượng Acid Uric"> Định lượng Acid Uric</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Định lượng Bilirubin toàn phần"> Định lượng Bilirubin toàn phần</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Định lượng Bilirubin trực tiếp"> Định lượng Bilirubin trực tiếp</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Định lượng Bilirubin gián tiếp"> Định lượng Bilirubin gián tiếp</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Định lượng Cholesterol toàn phần"> Định lượng Cholesterol toàn phần</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Định lượng Triglycerid"> Định lượng Triglycerid</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Định lượng HDL-C"> Định lượng HDL-C</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Định lượng LDL-C"> Định lượng LDL-C</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Định lượng Creatinin"> Định lượng Creatinin</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Định lượng Urê máu"> Định lượng Urê máu</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Định lượng Glucose"> Định lượng Glucose</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Định lượng HbA1c"> Định lượng HbA1c</label>
        </div>

        <div class="cls-category-title">💧 3. NƯỚC TIỂU</div>
        <div class="cls-grid">
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Tổng phân tích nước tiểu"> Tổng phân tích nước tiểu</label>
        </div>

        <div class="cls-category-title">🔬 4. VI KHUẨN - KST & TEST NHANH</div>
        <div class="cls-grid">
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Dengue virus NS1Ag test nhanh"> Dengue virus NS1Ag test nhanh</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Dengue virus NS1Ag/IgM - IgG test nhanh"> Dengue virus NS1Ag/IgM - IgG test nhanh</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="HBsAg test nhanh"> HBsAg test nhanh</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="HBeAb test nhanh"> HBeAb test nhanh</label>
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="HCV Ab test nhanh"> HCV Ab test nhanh</label>
        </div>

        <div class="cls-category-title">📍 5. XÉT NGHIỆM KHÁC</div>
        <div class="cls-grid">
            <label class="cls-item"><input type="checkbox" class="cls-checkbox" value="Xét nghiệm đường máu mao mạch tại giường"> Đường máu mao mạch tại giường</label>
        </div>

        <div class="form-group full" style="margin-top: 15px;">
            <label>Chỉ định khác / Yêu cầu ghi chú cụ thể:</label>
            <textarea id="clsCustomNote" rows="2" placeholder="Nhập thêm chỉ định hoặc yêu cầu cận lâm sàng khác..."></textarea>
        </div>

        <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn btn-outline" type="button" onclick="saveClsNoteToPatient()">✅ Lưu Chỉ Định Vào Bệnh Án</button>
            <button class="btn" type="button" onclick="printClsSheet()">🖨️ In Giấy Chỉ Định CLS (A5)</button>
        </div>
    </div>
</div>
